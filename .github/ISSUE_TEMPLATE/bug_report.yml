name: Bug report
description: Something on mygjakova.com looks or works wrong.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page
      description: The full URL, including the language (/sq/, /de/, /tr/, /sv/).
      placeholder: https://mygjakova.com/places/hadum-mosque/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what the page did instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iOS 26, or Firefox on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything in the browser's developer console, if you can open it.
      render: text
