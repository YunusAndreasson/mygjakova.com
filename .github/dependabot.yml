# Weekly, grouped so a week's updates arrive as a few pull requests. Each one
# runs the verify workflow; merge it when it's green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # astro check doesn't support TypeScript 7 (the native compiler) yet; it
      # asks for TypeScript 6. Lift this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      map:
        patterns: ["maplibre-gl", "pmtiles", "@protomaps/*"]
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
