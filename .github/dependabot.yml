# Weekly, grouped so a week's updates arrive as a few pull requests. Each one
# runs the verify workflow; merge it when it's green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      map:
        patterns: ["maplibre-gl", "pmtiles", "@protomaps/*"]
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
