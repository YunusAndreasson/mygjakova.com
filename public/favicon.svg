<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Gjakova">
  <rect width="32" height="32" rx="6" fill="#2b2620" />
  <!-- Clock Tower (Sahat Kulla): tapered shaft + bell dome, terracotta. -->
  <path d="M8.5 28 L10.5 12 C10.5 7.5 12.8 4.5 16 4.5 C19.2 4.5 21.5 7.5 21.5 12 L23.5 28 Z" fill="#b4552d" />
  <!-- balcony / cornice -->
  <rect x="7" y="11" width="18" height="2" fill="#b4552d" />
  <!-- finial: stem + ball -->
  <rect x="15.2" y="2.8" width="1.6" height="2.4" fill="#b4552d" />
  <circle cx="16" cy="2.4" r="1.7" fill="#b4552d" />
  <!-- clock face -->
  <circle cx="16" cy="19" r="4.2" fill="#f6f1e7" />
  <!-- hands -->
  <path d="M16 19 L16 15.8 M16 19 L18.3 20" stroke="#7c381d" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>
